<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creighton Model Chart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="home-screen">
    <div class="home-header" style="padding-top: 20px; padding-left: 88px;">
      <h1>My Charts</h1>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" id="new-folder-btn">+ Folder</button>
        <button class="btn btn-secondary" id="new-photo-chart-btn">+ Photo Chart</button>
        <button class="btn btn-primary" id="new-chart-btn">+ New Chart</button>
      </div>
    </div>

    <div class="folder-breadcrumb hidden" id="folder-breadcrumb">
      <button class="btn btn-ghost" id="breadcrumb-back-btn">← All Charts</button>
      <span class="breadcrumb-folder-name" id="breadcrumb-folder-name"></span>
    </div>

    <div class="chart-list" id="chart-list">
      <!-- populated by home.js -->
    </div>
  </div>

  <!-- New / Rename chart / New / Rename folder modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">New Chart</h2>
      <input type="text" id="modal-input" placeholder="Chart name" maxlength="80" />
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Create</button>
      </div>
    </div>
  </div>

  <!-- Move chart to folder modal -->
  <div class="modal-overlay hidden" id="move-modal-overlay">
    <div class="modal">
      <h2>Move to Folder</h2>
      <div class="folder-picker" id="folder-picker-list">
        <!-- populated by home.js -->
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="move-modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="home.js"></script>
</body>
</html>
